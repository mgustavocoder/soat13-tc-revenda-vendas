services:
  vendas-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vendas_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - vendas_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-vendas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  vendas-api:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VENDAS_PORT: 3003
      DB_HOST: vendas-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vendas_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      CLIENTES_SERVICE_URL: ${CLIENTES_SERVICE_URL:-http://host.docker.internal:3001}
      VEICULOS_SERVICE_URL: ${VEICULOS_SERVICE_URL:-http://host.docker.internal:3002}
    ports:
      - "${VENDAS_PORT:-3003}:3003"
    depends_on:
      vendas-db:
        condition: service_healthy

volumes:
  vendas_mysql_data:
